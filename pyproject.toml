[project]
name = "deauville"
version = "0.1.0"
description = "Programme et administration du Deauville Festival du Rire 2027"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
deauville = "deauville.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deauville"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["B1", "B2", "B3", "B4", "B5", "b1.py", "b2.py", "b3_*.py", "tests/test_b3.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests", "B3/side", "B5/side"]
